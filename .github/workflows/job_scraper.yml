name: JobFinder Daily Scraper

on:
  schedule:
    # 06:30 UTC daily. Budapest is UTC+1 (winter) / UTC+2 (summer),
    # so this runs around 07:30–08:30 local time. Adjust as you like.
    - cron: "30 6 * * *"
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab.
    inputs:
      dry_run:
        description: "Run without sending notifications"
        type: boolean
        default: false

# Allow the workflow to commit the updated seen_jobs.json back to the repo.
permissions:
  contents: write

concurrency:
  group: jobfinder-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets — configure these in: Settings > Secrets and variables > Actions.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Set this repo VARIABLE to "1" if any target uses render: true (Playwright).
      ENABLE_PLAYWRIGHT: ${{ vars.ENABLE_PLAYWRIGHT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (only if enabled)
        if: ${{ env.ENABLE_PLAYWRIGHT == '1' }}
        run: python -m playwright install --with-deps chromium

      - name: Run JobFinder
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python run.py --verbose --dry-run
          else
            python run.py --verbose
          fi

      - name: Commit updated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- seen_jobs.json; then
            git add seen_jobs.json
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          else
            echo "No changes to seen_jobs.json."
          fi
